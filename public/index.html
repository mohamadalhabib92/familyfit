<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FamilyFit</title>
    <meta name="description" content="FamilyFit — agenda familial partagé (grégorien + hégirien), rituels et bien-être." />
    <meta name="theme-color" content="#2F4B43" />
    <link rel="manifest" href="/familyfit/manifest.json" />
    <link rel="apple-touch-icon" href="/familyfit/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyFit" />
    <style id="expo-reset">
      html, body { height: 100%; background: #F6F4EF; }
      body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Activez JavaScript pour utiliser FamilyFit.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/familyfit/sw.js', { scope: '/familyfit/' }).catch(function (e) { console.warn('SW', e); });
        });
      }
    </script>
  </body>
</html>
